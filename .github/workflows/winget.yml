name: winget

# Opens the pull request on microsoft/winget-pkgs for a PUBLISHED release. Off until it is switched on:
#   repository variable  WINGET_SUBMIT  = true
#   repository variable  WINGET_LICENSE = the licence as it should appear in the manifest (e.g. MIT)
#   repository secret    WINGET_PAT     = a classic personal access token with the "public_repo" scope
# The release's installer URL must be public (public repository, published release), or winget's validation of the
# pull request fails. Details and the manual route: packaging/winget/README.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a published release, e.g. v0.2.0
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  submit:
    name: Submit manifest to winget-pkgs
    if: vars.WINGET_SUBMIT == 'true' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Fill the manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          WINGET_LICENSE: ${{ vars.WINGET_LICENSE }}
        run: |
          version="${TAG#v}"
          installer="VoxFlow-Setup-$version.exe"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$installer"
          if ! curl --fail --silent --head --location --output /dev/null "$url"; then
            echo "::error::$url is not publicly downloadable (private repository, draft release or missing asset)."
            exit 1
          fi
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir winget-in --repo "$GITHUB_REPOSITORY"
          sha=$(awk -v f="$installer" '{ name = $2; sub(/^\*/, "", name); if (name == f) print $1 }' winget-in/SHA256SUMS.txt)
          if [ -z "$sha" ]; then echo "::error::$installer is not listed in SHA256SUMS.txt"; exit 1; fi
          python packaging/winget/update_manifest.py "$version" "$sha" --license "$WINGET_LICENSE" --strict --out winget-out
          cat winget-out/*.yaml
          echo "dir=winget-out" >> "$GITHUB_OUTPUT"

      - name: Submit with wingetcreate
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          WINGETCREATE_URL: https://github.com/microsoft/winget-create/releases/download/v1.28.1.0/wingetcreate.exe
          WINGETCREATE_SHA256: 63d980ba79e97042395bd6eb5992c2db9e01e9e7a8a22958a95c288f27310413
        run: |
          if [ -z "$WINGET_PAT" ]; then echo "::error::The WINGET_PAT secret is not set."; exit 1; fi
          # a fixed, checked version: this program is handed the token (it was "latest", unverified)
          curl --fail --silent --show-error --location --output wingetcreate.exe "$WINGETCREATE_URL"
          echo "$WINGETCREATE_SHA256  wingetcreate.exe" | sha256sum --check --strict
          ./wingetcreate.exe submit --token "$WINGET_PAT" "${{ steps.manifest.outputs.dir }}"
